name: Deploy to Siteground - HallOfDoom

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Angular CLI
        run: npm install -g @angular/cli

      - name: Install Dependencies
        run: npm install

      - name: Build Angular Project
        run: ng build

      - name: Deploy to SiteGround using rsync
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          
          rsync -avz --delete \
          -e "ssh -i private_key -o StrictHostKeyChecking=no -p $PORT"  \
          dist/directorio-kimetsu/browser/ $USER@$HOST:$REMOTE_PATH

        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PORT: ${{ secrets.PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
